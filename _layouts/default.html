<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
{% if page.keywords %}<meta name="keywords" content="{{ page.keywords }}">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="robots" content="index, follow">

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/favicon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="512x512" href="{{ '/assets/img/favicon-512.png' | relative_url }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/logo-horizontal.png' | absolute_url }}">
<meta property="og:site_name" content="{{ site.firm_name }}">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/img/logo-horizontal.png' | absolute_url }}">

{% if page.geo_lat %}
<!-- Local SEO geo tags -->
<meta name="geo.placename" content="{{ page.geo_name }}">
<meta name="geo.position" content="{{ page.geo_lat }};{{ page.geo_lng }}">
<meta name="geo.region" content="IN-AP">
<meta name="ICBM" content="{{ page.geo_lat }}, {{ page.geo_lng }}">
{% endif %}

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{% if page.schema %}
<script type="application/ld+json">
{{ page.schema }}
</script>
{% endif %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "{{ site.firm_name }}",
  "alternateName": "{{ site.title }}",
  "slogan": "{{ site.firm_tagline }}",
  "description": "{{ site.description | strip_newlines }}",
  "url": "{{ site.url }}",
  "logo": "{{ '/assets/img/logo-horizontal.png' | absolute_url }}",
  "image": "{{ '/assets/img/logo-horizontal.png' | absolute_url }}",
  "telephone": "{{ site.phone }}",
  "email": "{{ site.email }}",
  "areaServed": {
    "@type": "State",
    "name": "Andhra Pradesh"
  },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ site.office_city }}",
    "addressRegion": "{{ site.office_state }}",
    "addressCountry": "IN"
  },
  "priceRange": "₹₹"
}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script defer src="{{ '/assets/js/nav.js' | relative_url }}"></script>
<script defer src="{{ '/assets/js/scroll-effects.js' | relative_url }}"></script>
</body>
</html>
